openapi: 3.0.3
info:
  title: WarmHouse API
  version: 1.0.0
  description: REST API для управления устройствами, команд отопления (включение/выключение/установка температуры) и запросов телеметрии.
servers:
  - url: https://api.warmhouse.local
paths:
  /devices:
    get:
      tags: [Управление устройствами]
      summary: Получить список устройств
      parameters:
        - name: houseId
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Список устройств
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceList'
    post:
      tags: [Управление устройствами]
      summary: Регистрация нового устройства
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceCreate'
            examples:
              create:
                value:
                  houseId: "b6f1a7e1-2c2e-4f1b-9a1f-4d8c5b0f1a3a"
                  moduleId: "c2f2b8b2-3d3f-5g2c-0b2g-5e9d6c1f2b4b"
                  typeId: "a1b2c3d4-1111-2222-3333-444455556666"
                  serialNumber: "SN-001-HEAT-99"
      responses:
        '201':
          description: Устройство создано
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'
              examples:
                created:
                  value:
                    id: "d0f7a86d-9c12-4b9f-93c2-4e6c4e2b0f5a"
                    houseId: "b6f1a7e1-2c2e-4f1b-9a1f-4d8c5b0f1a3a"
                    moduleId: "c2f2b8b2-3d3f-5g2c-0b2g-5e9d6c1f2b4b"
                    typeId: "a1b2c3d4-1111-2222-3333-444455556666"
                    serialNumber: "SN-001-HEAT-99"
                    status: "inactive"
                    lastSeenAt: null
                    installedAt: "2026-01-20T09:00:00Z"
        '400':
          description: Ошибка валидации
        '500':
          description: Ошибка сервера
  /devices/{deviceId}:
    get:
      tags: [Управление устройствами]
      summary: Получить сведения об устройстве
      parameters:
        - name: deviceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Устройство найдено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'
        '404':
          description: Устройство не найдено
  /heating/commands:
    post:
      tags: [Отопление]
      summary: Отправить команду отопления (вкл/выкл/установка температуры)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HeatingCommand'
            examples:
              turnOn:
                value:
                  houseId: "b6f1a7e1-2c2e-4f1b-9a1f-4d8c5b0f1a3a"
                  deviceId: "d0f7a86d-9c12-4b9f-93c2-4e6c4e2b0f5a"
                  action: "on"
              setTemperature:
                value:
                  houseId: "b6f1a7e1-2c2e-4f1b-9a1f-4d8c5b0f1a3a"
                  deviceId: "d0f7a86d-9c12-4b9f-93c2-4e6c4e2b0f5a"
                  action: "set_temperature"
                  targetTemperature: 22.5
      responses:
        '202':
          description: Команда принята
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandAccepted'
        '400':
          description: Ошибка валидации
  /telemetry/devices/{deviceId}:
    get:
      tags: [Телеметрия]
      summary: Получить телеметрию устройства
      parameters:
        - name: deviceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: metric
          in: query
          schema:
            type: string
          example: temperature
        - name: from
          in: query
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Данные телеметрии
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TelemetryResponse'
              examples:
                data:
                  value:
                    deviceId: "d0f7a86d-9c12-4b9f-93c2-4e6c4e2b0f5a"
                    metric: "temperature"
                    unit: "C"
                    points:
                      - value: 21.7
                        recordedAt: "2026-01-20T10:00:00Z"
                      - value: 21.9
                        recordedAt: "2026-01-20T10:05:00Z"
components:
  schemas:
    DeviceCreate:
      type: object
      required: [houseId, moduleId, typeId, serialNumber]
      properties:
        houseId:
          type: string
          format: uuid
        moduleId:
          type: string
          format: uuid
        typeId:
          type: string
          format: uuid
        serialNumber:
          type: string
    Device:
      type: object
      properties:
        id:
          type: string
          format: uuid
        houseId:
          type: string
          format: uuid
        moduleId:
          type: string
          format: uuid
        typeId:
          type: string
          format: uuid
        serialNumber:
          type: string
        status:
          type: string
          enum: [inactive, active, online, offline]
        lastSeenAt:
          type: string
          format: date-time
          nullable: true
        installedAt:
          type: string
          format: date-time
    DeviceList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Device'
    HeatingCommand:
      type: object
      required: [houseId, deviceId, action]
      properties:
        houseId:
          type: string
          format: uuid
        deviceId:
          type: string
          format: uuid
        action:
          type: string
          enum: [on, off, set_temperature]
        targetTemperature:
          type: number
          format: double
          nullable: true
    CommandAccepted:
      type: object
      properties:
        commandId:
          type: string
          format: uuid
        status:
          type: string
          example: accepted
    TelemetryResponse:
      type: object
      properties:
        deviceId:
          type: string
          format: uuid
        metric:
          type: string
        unit:
          type: string
        points:
          type: array
          items:
            type: object
            properties:
              value:
                type: number
                format: double
              recordedAt:
                type: string
                format: date-time
